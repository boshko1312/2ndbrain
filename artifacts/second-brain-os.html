<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Second Brain OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: a fixed left rail, one working surface, and a drawer that slides over it. The particle stage sits behind the Brain and Timeline views. */
:root{
  color-scheme:dark;
  --bg:#060607; --surface:#111110; --raised:#1a1a19; --line:#2a2a28; --line-soft:#1f1f1d;
  --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8b8a82; --ink-4:#5d5c56;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b; --info:#3987e5;
  --display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --text:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --rail:208px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--text);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
.cap{font:500 10.5px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}

#app{position:relative;height:100%;display:grid;grid-template-columns:var(--rail) minmax(0,1fr)}
/* rail */
#nav{display:flex;flex-direction:column;gap:2px;padding:18px 10px 14px var(--gl);border-right:1px solid var(--line-soft);background:var(--bg);min-width:0}
#brand{font:600 15px var(--display);padding:0 8px 14px}
#brand small{display:block;font:400 10.5px var(--mono);color:var(--ink-3);letter-spacing:.06em;margin-top:3px}
#nav button.nv{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-align:left}
#nav button.nv:hover{background:var(--surface);color:var(--ink)}
#nav button.nv.on{background:var(--raised);color:var(--ink)}
#nav .badge{font:500 11px var(--mono);color:var(--ink-3)}
#nav .sp{flex:1}
#searchBtn{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink-3)}
#searchBtn:hover{border-color:var(--ink-4);color:var(--ink-2)}
#searchBtn kbd{font:11px var(--mono)}
#demoNote{font:10.5px/1.5 var(--mono);color:var(--ink-4);padding:8px}

#main{position:relative;min-width:0;min-height:0;overflow:hidden}
#stage{position:absolute;inset:0;display:none;background:#000}
#gl{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing} #gl.hot{cursor:pointer}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font:500 10.5px var(--mono);letter-spacing:.06em;color:var(--ink-2);padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:rgba(6,6,7,.72);will-change:transform}
.lb.yr{border-color:transparent;background:none;color:var(--ink-3)}
#ring{position:absolute;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border:1.5px solid var(--ink);border-radius:50%;pointer-events:none;will-change:transform}
body.at-brain #stage{display:block}
body.at-timeline #stage{display:block;left:54%;border-left:1px solid var(--line-soft)}

.view{position:absolute;inset:0;overflow:auto;padding:26px var(--gr) 40px 28px;display:none}
.view.on{display:block}
.view>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:18px}
.view>header h1{font-size:24px}
.view>header p{margin:0;color:var(--ink-3);max-width:68ch}

/* Now */
.live{border:1px solid var(--line);border-radius:10px;margin-bottom:22px;background:var(--surface)}
.live .row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line-soft);cursor:pointer}
.live .row:first-of-type{border-top:0}
.live .row:hover{background:var(--raised)}
.live .hd{padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.live .what{color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.live b{font-weight:500}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.col h3{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.col h3 .num{color:var(--ink-3)}
.card{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 13px;margin-bottom:10px}
.card:hover{border-color:var(--ink-4);background:var(--raised)}
.card h4{margin:0 0 3px;font:600 14px var(--display)}
.card .area{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.card .next{margin:9px 0 9px;color:var(--ink-2);font-size:13px}
.card .next b{display:block;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.card .ft{display:flex;flex-wrap:wrap;gap:4px 10px;font:11px var(--mono);color:var(--ink-3)}
.st{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);letter-spacing:.04em;color:var(--ink-2)}
.st i{width:9px;height:9px;flex:none}
.st.s0 i{background:var(--warn);border-radius:2px;transform:rotate(45deg)}
.st.s1 i{background:var(--good);border-radius:50%}
.st.s2 i{border:2px solid var(--serious);border-radius:50%}
.st.s3 i{background:var(--info);border-radius:2px}

/* Brain overlays */
#v-brain{padding:0;overflow:hidden;pointer-events:none}
#v-brain>*{pointer-events:auto}
.glass{background:rgba(10,10,10,.78);border:1px solid var(--line);border-radius:12px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#bTop{position:absolute;left:16px;top:14px;right:292px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;pointer-events:none}
#bTop>*{pointer-events:auto}
#bCount{font:12px var(--mono);color:var(--ink-2);padding:6px 10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;background:rgba(10,10,10,.78);color:var(--ink-2)}
.chip button{color:var(--ink-3);font-size:14px;line-height:1}
.chip button:hover{color:var(--ink)}
#bHint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:min(560px,calc(100% - 600px));text-align:center;font-size:12px;color:var(--ink-3);pointer-events:none}
#legend{position:absolute;left:16px;bottom:14px;width:236px;max-height:46%;overflow:auto;padding:10px 6px 8px}
#legend .cap{padding:0 8px 6px;display:flex;justify-content:space-between}
#legend button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:4px 8px;border-radius:6px;text-align:left;font-size:12.5px;color:var(--ink-2)}
#legend button:hover{background:var(--raised);color:var(--ink)}
#legend button.on{background:var(--raised);color:var(--ink)}
#legend button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#legend button .num{font-size:11px;color:var(--ink-3)}
#vp{position:absolute;right:var(--gr);top:14px;width:272px;max-height:calc(100% - 28px);overflow:auto;padding:14px}
#vp h4{margin:14px 0 8px}
#vp h4:first-child{margin-top:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1 1 0;min-width:0;padding:7px 0;font-size:12px;color:var(--ink-3);border-left:1px solid var(--line)}
.seg.sub{margin-top:6px}.seg.sub button{font-size:11.5px;padding:6px 0}
.row select{width:150px}
#heatBar{height:8px;border-radius:4px;margin:2px 8px 4px}
.heatEnds{display:flex;justify-content:space-between;padding:0 8px;font:10px var(--mono);color:var(--ink-3)}
.heatNote{margin:6px 8px 6px;font-size:12px;color:var(--ink-2)}
.seg button:first-child{border-left:0}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:#000;font-weight:500}
#formNote{margin:8px 0 0;font-size:12px;color:var(--ink-3)}
select{width:100%;font:13px var(--text);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px;font-size:13px;color:var(--ink-2)}
.tg{position:relative;width:32px;height:18px;border-radius:9px;border:1px solid var(--line);background:var(--surface);flex:none}
.tg::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--ink-3);transition:transform .15s}
.tg[aria-pressed="true"]{background:var(--ink-2);border-color:var(--ink-2)}
.tg[aria-pressed="true"]::after{background:#000;transform:translateX(14px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:120px;height:18px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink);margin-top:-5px}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--ink-3);background:var(--raised)}
.btn.pri{background:var(--ink);color:#000;border-color:var(--ink);font-weight:500}
#vpBtn{display:none;position:absolute;right:var(--gr);top:12px}

/* Timeline */
#v-timeline{right:46%;border-right:0}
.tlbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tlbar .btn{padding:4px 10px;font:12px var(--mono)}
.tlbar .btn.on{background:var(--ink);color:#000;border-color:var(--ink)}
#chartWrap{position:relative;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:12px 10px 6px}
#chart{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
#chart text{font:10px var(--mono);fill:var(--ink-3)}
#chartLegend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 4px 2px;font-size:12px;color:var(--ink-2)}
#chartLegend span{display:inline-flex;align-items:center;gap:6px}
#chartLegend i{width:10px;height:10px;border-radius:2px}
#tlRead{margin:12px 0 4px;font-size:13px;color:var(--ink-2)}
#tlRead b{color:var(--ink);font-weight:500}
table.tb{border-collapse:collapse;font:12px var(--mono);font-variant-numeric:tabular-nums;width:100%}
table.tb th,table.tb td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--line-soft);color:var(--ink-2);white-space:nowrap}
table.tb th:first-child,table.tb td:first-child{text-align:left}
.scroll-x{overflow-x:auto}
.list{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.list .li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:9px 13px;border-top:1px solid var(--line-soft);text-align:left}
.list .li:first-child{border-top:0}
.list button.li:hover{background:var(--raised)}
.list .li small{color:var(--ink-3);font:11px var(--mono)}
.list .li .t{min-width:0;overflow-wrap:anywhere}
.sec{margin:22px 0 8px}

/* Projects, Inbox, Sources */
.prow{display:grid;grid-template-columns:minmax(0,1.6fr) 130px 70px 110px;gap:12px;align-items:center;width:100%;padding:9px 13px;border-top:1px solid var(--line-soft);text-align:left}
.prow:first-child{border-top:0}
.prow:hover{background:var(--raised)}
.prow small{color:var(--ink-3);font:11px var(--mono)}
.inrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:10px 13px;border-top:1px solid var(--line-soft)}
.inrow:first-child{border-top:0}
.inrow .acts{display:flex;gap:6px;flex-wrap:wrap}
.inrow .btn{padding:4px 10px;font-size:12px}
.src{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.src>div{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px}
.src h4{margin:0 0 2px;font:600 14px var(--display)}
.src p{margin:6px 0 10px;color:var(--ink-2);font-size:13px}

/* Drawer */
#drawer{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);padding:18px var(--gr) 28px 20px;overflow:auto;transform:translateX(102%);transition:transform .22s ease;z-index:20}
#drawer.open{transform:none}
#drawer .x{position:absolute;right:var(--gr);top:12px;width:30px;height:30px;border-radius:8px;font-size:18px;color:var(--ink-3)}
#drawer .x:hover{background:var(--raised);color:var(--ink)}
#drawer h2{font-size:20px;margin:6px 34px 6px 0}
#drawer .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font:11.5px var(--mono);color:var(--ink-3)}
#drawer p{color:var(--ink-2);max-width:60ch}
#drawer h5{margin:18px 0 6px}
#drawer .acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.ref{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:8px;color:var(--ink-2)}
.ref:hover{background:var(--raised);color:var(--ink)}
.ref small{display:block;font:11px var(--mono);color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font:11px var(--mono);color:var(--ink-2)}

#tip{position:fixed;left:0;top:0;z-index:40;pointer-events:none;max-width:280px;padding:7px 10px;border-radius:8px;background:rgba(6,6,7,.94);border:1px solid var(--line);font-size:12.5px;will-change:transform}
#tip small{display:block;font:11px var(--mono);color:var(--ink-3);margin-top:2px}
#tip .tr{display:flex;justify-content:space-between;gap:14px;font:11.5px var(--mono);color:var(--ink-2)}
#tip .tr i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
#pal{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:flex-start;padding:12vh var(--gr) 0 var(--gl)}
#pal>div{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#palIn{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:15px var(--text);padding:14px 16px;outline:none}
#palOut{max-height:52vh;overflow:auto}
#palOut .ref{border-radius:0;padding:9px 16px}
#palOut .ref.sel{background:var(--raised)}
#toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;padding:9px 14px;border-radius:8px;background:var(--ink);color:#000;font-size:13px;max-width:calc(100% - 32px)}

@media (max-width:1100px){ .board{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  #nav{order:2;flex-direction:row;gap:0;padding:6px var(--gr) 6px var(--gl);border-right:0;border-top:1px solid var(--line-soft);overflow-x:auto}
  #brand,#searchBtn kbd,#demoNote,#nav .sp{display:none}
  #searchBtn{margin:0;border:0;padding:8px 10px}
  #nav button.nv{flex:1 0 auto;justify-content:center;gap:5px;padding:8px 9px;font-size:12.5px}
  .view{padding:18px var(--gr) 30px var(--gl)}
  .board{grid-template-columns:minmax(0,1fr)}
  .live .row{grid-template-columns:minmax(0,1fr)}
  body.at-timeline #stage{display:none}
  #v-timeline{right:0}
  #bTop{left:var(--gl);right:84px}
  #vp{display:none;left:var(--gl);right:var(--gr);top:52px;width:auto;max-height:62%}
  #vp.open{display:block}
  #vpBtn{display:inline-flex}
  #legend{left:var(--gl);right:var(--gr);width:auto;max-height:118px;bottom:10px}
  #bHint{display:none}
  .prow{grid-template-columns:minmax(0,1fr) auto}
  .prow .hide-s{display:none}
  #drawer{top:auto;height:78%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(102%);padding-left:var(--gl)}
}
@media (prefers-reduced-motion:reduce){ #drawer,.tg::after{transition:none} }
</style>

</head>
<body>
<div id="app">
  <nav id="nav" aria-label="Sections">
    <div id="brand">Second Brain OS<small>demo data · mockup</small></div>
    <button id="searchBtn" aria-label="Search"><span>Search</span><kbd>⌘K</kbd></button>
    <button class="nv" data-view="now"><span>Now</span><span class="badge" id="bdNow"></span></button>
    <button class="nv" data-view="brain"><span>Brain</span></button>
    <button class="nv" data-view="timeline"><span>Timeline</span></button>
    <button class="nv" data-view="projects"><span>Projects</span><span class="badge" id="bdProj"></span></button>
    <button class="nv" data-view="inbox"><span>Inbox</span><span class="badge" id="bdInbox"></span></button>
    <button class="nv" data-view="sources"><span>Sources</span></button>
    <div class="sp"></div>
    <div id="demoNote">Everything here is generated example data. Nothing is imported or saved.</div>
  </nav>

  <main id="main">
    <div id="stage"><canvas id="gl"></canvas><div id="labels"></div><div id="ring" hidden></div></div>

    <section class="view" id="v-now"></section>

    <section class="view" id="v-brain">
      <div id="bTop"><span id="bCount" class="glass"></span><span id="bChips"></span></div>
      <button id="vpBtn" class="btn glass">View</button>
      <div id="vp" class="glass">
        <h4 class="cap">Form</h4>
        <div class="seg" id="modeSeg"><button data-mode="anatomy">Anatomy</button><button data-mode="groups">Groups</button><button data-mode="table">Table</button></div>
        <div class="seg sub" id="formSeg" hidden></div>
        <div class="row" id="acrossRow" hidden style="margin-top:8px"><label for="across">Across</label><select id="across"><option value="year">Year</option><option value="moy">Month of year</option><option value="source">Source</option><option value="type">What it is</option><option value="status">Project status</option><option value="area">Area of life</option></select></div>
        <p id="formNote"></p>
        <h4 class="cap">Group by</h4>
        <select id="groupBy" aria-label="Group by">
          <option value="area">Area of life</option><option value="project">Project</option><option value="source">Source</option>
          <option value="type">What it is</option><option value="status">Project status</option><option value="year">Year</option>
        </select>
        <h4 class="cap">Colour</h4>
        <div class="seg" id="colSeg"><button data-col="group">By group</button><button data-col="thermal">Thermal</button></div>
        <div class="row" id="heatRow" hidden style="margin-top:8px"><label for="heatBy">Heat shows</label><select id="heatBy"><option value="activity">Recent activity</option><option value="age">Age</option><option value="needs">Needs you</option></select></div>
        <h4 class="cap">Show</h4>
        <div class="row"><span>Labels</span><button class="tg" id="tLabels" aria-pressed="true" aria-label="Labels"></button></div>
        <div class="row"><span>Links</span><button class="tg" id="tLinks" aria-pressed="true" aria-label="Links"></button></div>
        <div class="row"><span>Spine and nerves</span><button class="tg" id="tScaf" aria-pressed="true" aria-label="Spine and nerves"></button></div>
        <div class="row"><span>Turning</span><button class="tg" id="tTurn" aria-pressed="true" aria-label="Turning"></button></div>
        <h4 class="cap">Drawn</h4>
        <div class="row"><label for="sSize">Point size</label><input type="range" id="sSize" min="0.5" max="2.2" step="0.01" value="1"></div>
        <div class="row"><label for="sGlow">Glow</label><input type="range" id="sGlow" min="0" max="2" step="0.01" value="0.6"></div>
        <div class="row"><label for="sDust">Fine dust</label><input type="range" id="sDust" min="0" max="2" step="0.01" value="1"></div>
        <div class="row" style="margin-top:8px"><button class="btn" id="bReset">Reset view</button><button class="btn" id="bClear">Clear filters</button></div>
      </div>
      <div id="legend" class="glass"></div>
      <div id="bHint"></div>
    </section>

  const how = ["Live. Session files are read as they are written, so running terminals show up on the Now board.","Manual export. You download your data from the app and drop the file here.","Manual export. You download your data from the app and drop the file here.","Manual export, if your account offers one. Not verified.","Live. A notes folder on the homelab is watched for changes.","Live. Chosen folders on the homelab are indexed; the files stay where they are."];
  const last = ["a minute ago","3 days ago","5 weeks ago","2 weeks ago","an hour ago","an hour ago"];
  $("#v-sources").innerHTML = `<header><h1>Sources</h1><p>Where the record comes from, and how fresh each source is.</p></header><div class="src">${SOURCES.map((s, k) => `<div><h4>${esc(s[0])}</h4><div class="cap">${fmt(cnt[k])} items · updated ${last[k]}</div><p>${how[k]}</p><button class="btn" data-toast="This is a mockup, so nothing is imported.">${k === 0 || k > 3 ? "Choose folders" : "Import an export file"}</button></div>`).join("")}</div>`; }

/* Timeline: one stacked column per quarter, by area. Drag across it to light that span in the brain. */
const NQ = 24; let tlTable = false, brush = null;
function quarterCounts(){ const c = Array.from({length:NQ}, () => new Int32Array(8)); for(let i=0;i<NI;i++){ if(F.project !== null && iProj[i] !== F.project) continue; if(F.group && GROUPS[F.group.by].of(i) !== F.group.val) continue; c[Math.min(NQ-1, Math.floor(iTm[i]/3))][iArea[i]]++; } return c; }
function renderTimeline(){ const c = quarterCounts(), tot = c.map(q => q.reduce((a, b) => a+b, 0)), max = Math.max(1, ...tot), step = [100,200,500,1000,2000,5000].find(s => max/s <= 5) || 5000, top = Math.ceil(max/step)*step;
  const W = 720, H = 300, L = 44, B = 26, Tp = 10, pw = (W-L-6)/NQ, bw = pw-6, ph = H-B-Tp, y = v => Tp+ph-v/top*ph, r0 = F.range ? Math.round(F.range[0]/3) : 0, r1 = F.range ? Math.round(F.range[1]/3)-1 : NQ-1;
  let svg = ""; for(let v=0;v<=top;v+=step) svg += `<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${fmt(v)}</text>`;
  c.forEach((q, qi) => { let acc = 0; const x = L+qi*pw+3, dim = F.range && (qi < r0 || qi > r1);
    for(let a=0;a<8;a++){ if(!q[a]) continue; const y1 = y(acc+q[a]), h = y(acc)-y1; if(h > 2.5) svg += `<rect x="${x}" y="${y1+1}" width="${bw}" height="${h-2}" rx="${Math.min(2, h/2)}" fill="${AREAS[a][1]}" opacity="${dim ? 0.25 : 1}"/>`; acc += q[a]; }
    if(qi % 4 === 0) svg += `<text x="${x}" y="${H-8}">${2021+qi/4}</text>`; });
  svg += `<rect id="brushRect" x="0" y="${Tp}" width="0" height="${ph}" fill="var(--ink)" opacity="0.1" pointer-events="none"/>`;
  let n = 0; const pc = new Int32Array(NP); for(let i=0;i<NI;i++){ if(!match(i)) continue; n++; if(iProj[i] >= 0) pc[iProj[i]]++; } const topP = [...Array(NP).keys()].sort((a, b) => pc[b]-pc[a]).slice(0, 6).filter(i => pc[i]);
  $("#v-timeline").innerHTML = `<header><h1>Timeline</h1><p>What you wrote and when, by area of life. Drag across the chart, or pick a year, to light that span in the brain.</p></header>
  <div class="tlbar" role="group" aria-label="Year"><button class="btn ${F.range ? "" : "on"}" data-year="all">All</button>${YEARS.map((yv, k) => `<button class="btn ${F.range && F.range[0] === k*12 && F.range[1] === k*12+12 ? "on" : ""}" data-year="${k}">${yv[0]}</button>`).join("")}<button class="btn" data-table style="margin-left:auto">${tlTable ? "Chart" : "Table"}</button></div>
  ${tlTable ? `<div class="scroll-x list"><table class="tb"><thead><tr><th>Quarter</th>${AREAS.map(a => `<th>${esc(a[0])}</th>`).join("")}<th>Total</th></tr></thead><tbody>${c.map((q, qi) => `<tr><td>${qName(qi)}</td>${[...q].map(v => `<td>${fmt(v)}</td>`).join("")}<td>${fmt(tot[qi])}</td></tr>`).join("")}</tbody></table></div>` :
  `<div id="chartWrap"><svg id="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Items per quarter, stacked by area of life">${svg}</svg><div id="chartLegend">${AREAS.map(a => `<span><i style="background:${a[1]}"></i>${esc(a[0])}</span>`).join("")}</div></div>`}
  <p id="tlRead"><b>${F.range ? rangeText() : "January 2021 to November 2026"}</b> · ${fmt(n)} items${F.project !== null ? " in "+esc(PROJ[F.project].name) : ""}</p>
  <h3 class="cap sec">Most active in this span</h3><div class="list">${topP.map(i => `<button class="li" data-proj="${i}"><span class="t">${esc(PROJ[i].name)} <small>${esc(AREAS[PROJ[i].area][0])}</small></span><small class="num">${fmt(pc[i])}</small></button>`).join("") || `<div class="li"><span class="t">Nothing in this span.</span></div>`}</div>
  <div style="margin-top:16px"><button class="btn" data-go="brain">Open this span in the Brain</button></div>`;
  const ch = $("#chart"); if(!ch) return; const qAt = e => { const r = ch.getBoundingClientRect(); return clamp(Math.floor(((e.clientX-r.left)/r.width*W-L)/pw), 0, NQ-1); };
  ch.onpointerdown = e => { ch.setPointerCapture(e.pointerId); const q = qAt(e); brush = [q, q]; paint(); };
  ch.onpointercancel = () => { brush = null; filtersChanged(); };
  const paint = () => { const a = Math.min(brush[0], brush[1]), b = Math.max(brush[0], brush[1]), br = $("#brushRect"); br.setAttribute("x", L+a*pw); br.setAttribute("width", (b-a+1)*pw);
    F.range = [a*3, (b+1)*3]; const lit = relit(); uploadMisc(); $("#tlRead").innerHTML = `<b>${rangeText()}</b> · ${fmt(lit)} items`; };   // the brain lights up while you drag
  ch.onpointermove = e => { const q = qAt(e); if(brush){ hideTip(); if(q !== brush[1]){ brush[1] = q; paint(); } return; }
    showTip(e.clientX, e.clientY, `<b>${qName(q)}</b>`+[...c[q]].map((v, a) => v ? `<div class="tr"><span><i style="background:${AREAS[a][1]}"></i>${esc(AREAS[a][0])}</span><span>${fmt(v)}</span></div>` : "").join("")+`<div class="tr"><span>Total</span><span>${fmt(tot[q])}</span></div>`); };
  ch.onpointerup = () => { if(!brush) return; brush = null; filtersChanged(); };
  ch.onpointerleave = hideTip; }

/* ------------------------------------------------------------ 6. DRAWER, SEARCH, ROUTING */
const refBtn = i => `<button class="ref" data-open="${i}">${esc(title(i))}<small>${TYPES[iType[i]][0]} · ${SOURCES[iSrc[i]][0]} · ${dateOf(iTm[i])}</small></button>`;
function openItem(i){ selected = i; const p = iProj[i], ls = linksOf(i);
  $("#drawer").innerHTML = `<button class="x" aria-label="Close">×</button><div class="cap">${TYPES[iType[i]][0]}</div><h2>${esc(title(i))}</h2>
  <div class="meta"><span>${SOURCES[iSrc[i]][0]}</span><span>${dateOf(iTm[i])}</span><span>${[0,4,6].includes(iType[i]) ? "you and an assistant" : "your words"}</span></div>
  <p>${esc(excerpt(i))}</p>
  <div class="acts">${p >= 0 ? `<button class="btn pri" data-proj="${p}">Open ${esc(PROJ[p].name)}</button>` : `<button class="btn pri" data-go="inbox">File it from the Inbox</button>`}<button class="btn" data-show-item="${i}">Find it in the Brain</button></div>
  <h5 class="cap">Where it sits</h5><div class="meta" style="gap:6px"><span class="pill"><i class="dot" style="background:${AREAS[iArea[i]][1]}"></i>${esc(AREAS[iArea[i]][0])}</span><span class="pill">${p >= 0 ? esc(PROJ[p].name) : "No project"}</span><span class="pill">${isBrain(i) ? "Brain" : "Body, "+dateOf(iTm[i]).split(" ").slice(1).join(" ")}</span></div>
  <h5 class="cap">Linked to ${ls.length}</h5>${ls.map(refBtn).join("")}<p style="font:11px var(--mono);color:var(--ink-4);margin-top:18px">Generated example content.</p>`;
  $("#drawer").classList.add("open"); }
function openProject(pi){ const p = PROJ[pi], sc = new Int32Array(6); let recent = []; for(let k=0;k<p.n;k++){ sc[iSrc[p.start+k]]++; recent.push(p.start+k); } recent = recent.sort((a, b) => iTm[b]-iTm[a]).slice(0, 5);
  $("#drawer").innerHTML = `<button class="x" aria-label="Close">×</button><div class="cap">Project</div><h2>${esc(p.name)}</h2>
  <div class="meta">${stPill(p.status)}<span>${dateOf(p.s).split(" ").slice(1).join(" ")} to ${dateOf(p.last).split(" ").slice(1).join(" ")}</span><span>${fmt(p.n)} items</span></div>
  <div class="acts"><button class="btn pri" data-show-proj="${pi}">Light it up in the Brain</button><button class="btn" data-tl-proj="${pi}">See it on the Timeline</button></div>
  <h5 class="cap">What it is</h5><p>${esc(p.blurb)}</p>
  <h5 class="cap">Where it stands</h5><p>${["Waiting on you.","Running.","Stalled.","Finished."][p.status]} Last activity ${ago(p.last)}. ${esc(p.next)}</p>
  <div class="meta" style="gap:6px"><span class="pill"><i class="dot" style="background:${AREAS[p.area][1]}"></i>${esc(AREAS[p.area][0])}</span>${[...sc].map((v, k) => v ? `<span class="pill">${SOURCES[k][0]} ${fmt(v)}</span>` : "").join("")}</div>
  <h5 class="cap">Open questions · ${p.openQ}</h5>${p.questions.map(refBtn).join("") || "<p>None.</p>"}${p.openQ > 3 ? `<p style="color:var(--ink-3);font-size:12.5px">and ${p.openQ-3} more</p>` : ""}
  <h5 class="cap">Key decisions</h5>${p.decisions.map(refBtn).join("") || "<p>None.</p>"}
  <h5 class="cap">Most recent</h5>${recent.map(refBtn).join("")}
  <p style="font:11px var(--mono);color:var(--ink-4);margin-top:18px">In the real system this page is written by a model, and every line links to the chat it came from.</p>`;
  $("#drawer").classList.add("open"); }
function closeDrawer(){ $("#drawer").classList.remove("open"); }
let toastT = 0; function toast(s){ const t = $("#toast"); t.textContent = s; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }
let titles = null, palSel = 0, palHits = [];
function palSearch(){ const q = $("#palIn").value.trim().toLowerCase(); palHits = []; if(q){ PROJ.forEach((p, i) => { if(p.name.toLowerCase().includes(q)) palHits.push(["p", i]); });
    if(!titles){ titles = new Array(NI); for(let i=0;i<NI;i++) titles[i] = title(i).toLowerCase(); } const hit = []; for(let i=0;i<NI && hit.length<400;i++) if(titles[i].includes(q)) hit.push(i); hit.sort((a, b) => iTm[b]-iTm[a]).slice(0, 8).forEach(i => palHits.push(["i", i])); }
  palSel = 0; $("#palOut").innerHTML = palHits.map((h, k) => h[0] === "p" ? `<button class="ref ${k ? "" : "sel"}" data-proj="${h[1]}">${esc(PROJ[h[1]].name)}<small>Project · ${esc(AREAS[PROJ[h[1]].area][0])} · ${STATUS[PROJ[h[1]].status][0]}</small></button>` : refBtn(h[1]).replace('class="ref"', `class="ref ${k ? "" : "sel"}"`)).join("") || (q ? `<p style="padding:12px 16px;color:var(--ink-3)">Nothing matches “${esc(q)}”.</p>` : `<p style="padding:12px 16px;color:var(--ink-3)">Type a project name or a few words from a title.</p>`); }
function palOpen(o){ $("#pal").hidden = !o; if(o){ $("#palIn").value = ""; palSearch(); $("#palIn").focus(); } }
function go(v){ if(!["now","brain","timeline","projects","inbox","sources"].includes(v)) v = "now"; view = v; document.body.className = "at-"+v; $$(".view").forEach(e => e.classList.toggle("on", e.id === "v-"+v)); $$("#nav .nv").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  ({now:renderNow, projects:renderProjects, inbox:renderInbox, sources:renderSources, timeline:renderTimeline, brain:() => {}})[v](); hideTip(); cssW = 0; if(location.hash.slice(1) !== v){ try{ history.replaceState(null, "", "#"+v); }catch(e){} } }
function syncForm(){ const m = modeOf(S.form); $$("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  const fs = $("#formSeg"); fs.hidden = m === "anatomy"; fs.innerHTML = (FORMS[m] || []).map(f => `<button data-form="${f[0]}" class="${f[0] === S.form ? "on" : ""}">${f[1]}</button>`).join("");
  $("#acrossRow").hidden = S.form !== "grid"; $$("#colSeg button").forEach(b => b.classList.toggle("on", (b.dataset.col === "thermal") === S.thermal)); $("#heatRow").hidden = !S.thermal; }
function setForm(f){ S.form = f; const m = modeOf(f); if(m === "groups") S.gform = f; else if(m === "table") S.tform = f; syncForm(); applyLayout(true); }
function setThermal(on){ S.thermal = on; if(!on && F.heat !== null){ F.heat = null; } syncForm(); if(flBuf.length) applyLayout(false); else recolour(); filtersChanged(); }
document.addEventListener("click", e => { const t = e.target.closest("[data-view],[data-proj],[data-open],[data-go],[data-form],[data-mode],[data-col],[data-heat],[data-val],[data-clear],[data-year],[data-table],[data-file],[data-toast],[data-show-proj],[data-show-item],[data-tl-proj],.x,.tg"); if(!t) { if(e.target.id === "pal") palOpen(false); return; }
  const d = t.dataset;
  if(t.classList.contains("x")) return closeDrawer();
  if(t.classList.contains("tg")){ const on = t.getAttribute("aria-pressed") !== "true"; t.setAttribute("aria-pressed", on); ({tLabels:() => S.labels = on, tLinks:() => S.links = on, tScaf:() => S.scaf = on, tTurn:() => S.turn = on})[t.id](); return; }
  if(d.view) return go(d.view);
  if(d.form) return setForm(d.form);
  if(d.mode) return setForm(d.mode === "anatomy" ? "anatomy" : d.mode === "groups" ? S.gform : S.tform);
  if(d.col) return setThermal(d.col === "thermal");
  if(d.heat !== undefined){ const v = +d.heat; F.heat = F.heat === v ? null : v; return filtersChanged(); }
  if(d.val !== undefined){ const v = +d.val; F.group = F.group && F.group.by === S.by && F.group.val === v ? null : {by:S.by, val:v}; return filtersChanged(); }
  if(d.clear){ if(d.clear === "heat") F.heat = null; else if(d.clear === "group") F.group = null; else if(d.clear === "project") F.project = null; else F.range = null; return filtersChanged(); }
  if(d.year !== undefined){ F.range = d.year === "all" ? null : [+d.year*12, +d.year*12+12]; return filtersChanged(); }
  if(d.table !== undefined){ tlTable = !tlTable; return renderTimeline(); }
  if(d.toast) return toast(d.toast);
  if(d.file){ const i = +d.file, p = +d.to; iProj[i] = p; iArea[i] = PROJ[p].area; iStat[i] = PROJ[p].status; inbox = inbox.filter(x => x !== i); anatDirty = true; titles = null; renderInbox(); applyLayout(false); filtersChanged(); return toast("Filed under "+PROJ[p].name+"."); }
  if(d.showProj !== undefined){ F.project = +d.showProj; F.group = null; closeDrawer(); go("brain"); return filtersChanged(); }
  if(d.tlProj !== undefined){ F.project = +d.tlProj; closeDrawer(); go("timeline"); return filtersChanged(); }
  if(d.showItem !== undefined){ const i = +d.showItem; F.project = iProj[i] >= 0 ? iProj[i] : null; F.group = null; F.range = null; selected = i; go("brain"); filtersChanged(); closeDrawer(); const k = i*3; cam.gTg = [pTo[k], pTo[k+1], pTo[k+2]]; cam.gDist = 60; return; }
  if(d.go){ closeDrawer(); return go(d.go); }
  if(d.proj !== undefined){ palOpen(false); return openProject(+d.proj); }
  if(d.open !== undefined){ palOpen(false); return openItem(+d.open); }
});
$("#groupBy").addEventListener("change", e => { S.by = e.target.value; if(F.group && F.group.by !== S.by) F.group = null; applyLayout(S.form !== "anatomy"); filtersChanged(); });
$("#sSize").addEventListener("input", e => { S.size = +e.target.value; }); $("#sGlow").addEventListener("input", e => { S.glow = +e.target.value; }); $("#sDust").addEventListener("input", e => { S.dust = +e.target.value; });
$("#bReset").onclick = () => homeCam(false); $("#bClear").onclick = () => { F.group = null; F.project = null; F.range = null; F.heat = null; filtersChanged(); };
$("#across").addEventListener("change", e => { S.across = e.target.value; applyLayout(true); });
$("#heatBy").addEventListener("change", e => { S.heat = e.target.value; F.heat = null; recolour(); filtersChanged(); });
$("#vpBtn").onclick = () => $("#vp").classList.toggle("open"); $("#searchBtn").onclick = () => palOpen(true); $("#palIn").addEventListener("input", palSearch);
addEventListener("keydown", e => { if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); return palOpen($("#pal").hidden); }
  if(!$("#pal").hidden){ if(e.key === "Escape") return palOpen(false); const els = $$("#palOut .ref"); if(e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); palSel = clamp(palSel+(e.key === "ArrowDown" ? 1 : -1), 0, els.length-1); els.forEach((x, k) => x.classList.toggle("sel", k === palSel)); els[palSel] && els[palSel].scrollIntoView({block:"nearest"}); } else if(e.key === "Enter" && els[palSel]) els[palSel].click(); return; }
  if(e.key === "Escape"){ closeDrawer(); selected = -1; } if(e.key === "Enter" && e.target.matches(".live .row")) e.target.click(); });
addEventListener("hashchange", () => go(location.hash.slice(1)));

window.__os = { S, F, cam, setThermal, heat, PROJ, NI, N, go, setForm, openItem, openProject, filtersChanged, project, get T(){ return T; }, pos:i => livePos(pTo[i*3], pTo[i*3+1], pTo[i*3+2], [0,0,0]), zoomAt, isBrain, title, pick };
if(gl){ initGL(); bindInput(); } else $("#stage").innerHTML = '<p style="padding:24px;color:var(--ink-3)">The Brain view needs WebGL2. The other pages still work.</p>';
syncForm();
applyLayout(false); filtersChanged(); renderInbox(); renderNow();
// the field condenses into shape the first time the Brain is opened
if(gl && !reduced){ for(let i=0;i<N;i++){ const k = i*3, q = 1.6+1.4*R(); pFrom[k] = pTo[k]*q+gauss()*30; pFrom[k+1] = pTo[k+1]*q+gauss()*30; pFrom[k+2] = pTo[k+2]*q+gauss()*30; } T = 0; uploadAll(); }
 go(location.hash.slice(1) || "now"); requestAnimationFrame(frame);
</script>
