<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Second Brain OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: a fixed left rail, one working surface, and a drawer that slides over it. The particle stage sits behind the Brain and Timeline views. */
:root{
  color-scheme:dark;
  --bg:#060607; --surface:#111110; --raised:#1a1a19; --line:#2a2a28; --line-soft:#1f1f1d;
  --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8b8a82; --ink-4:#5d5c56;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b; --info:#3987e5;
  --display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --text:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --rail:208px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--text);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
.cap{font:500 10.5px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}

#app{position:relative;height:100%;display:grid;grid-template-columns:var(--rail) minmax(0,1fr)}
/* rail */
#nav{display:flex;flex-direction:column;gap:2px;padding:18px 10px 14px var(--gl);border-right:1px solid var(--line-soft);background:var(--bg);min-width:0}
#brand{font:600 15px var(--display);padding:0 8px 14px}
#brand small{display:block;font:400 10.5px var(--mono);color:var(--ink-3);letter-spacing:.06em;margin-top:3px}
#nav button.nv{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-align:left}
#nav button.nv:hover{background:var(--surface);color:var(--ink)}
#nav button.nv.on{background:var(--raised);color:var(--ink)}
#nav .badge{font:500 11px var(--mono);color:var(--ink-3)}
#nav .sp{flex:1}
#searchBtn{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink-3)}
#searchBtn:hover{border-color:var(--ink-4);color:var(--ink-2)}
#searchBtn kbd{font:11px var(--mono)}
#demoNote{font:10.5px/1.5 var(--mono);color:var(--ink-4);padding:8px}

#main{position:relative;min-width:0;min-height:0;overflow:hidden}
#stage{position:absolute;inset:0;display:none;background:#000}
#gl{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing} #gl.hot{cursor:pointer}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font:500 10.5px var(--mono);letter-spacing:.06em;color:var(--ink-2);padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:rgba(6,6,7,.72);will-change:transform}
.lb.yr{border-color:transparent;background:none;color:var(--ink-3)}
#ring{position:absolute;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border:1.5px solid var(--ink);border-radius:50%;pointer-events:none;will-change:transform}
body.at-brain #stage{display:block}
body.at-timeline #stage{display:block;left:54%;border-left:1px solid var(--line-soft)}

.view{position:absolute;inset:0;overflow:auto;padding:26px var(--gr) 40px 28px;display:none}
.view.on{display:block}
.view>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:18px}
.view>header h1{font-size:24px}
.view>header p{margin:0;color:var(--ink-3);max-width:68ch}

/* Now */
.live{border:1px solid var(--line);border-radius:10px;margin-bottom:22px;background:var(--surface)}
.live .row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line-soft);cursor:pointer}
.live .row:first-of-type{border-top:0}
.live .row:hover{background:var(--raised)}
.live .hd{padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.live .what{color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.live b{font-weight:500}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.col h3{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.col h3 .num{color:var(--ink-3)}
.card{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 13px;margin-bottom:10px}
.card:hover{border-color:var(--ink-4);background:var(--raised)}
.card h4{margin:0 0 3px;font:600 14px var(--display)}
.card .area{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.card .next{margin:9px 0 9px;color:var(--ink-2);font-size:13px}
.card .next b{display:block;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.card .ft{display:flex;flex-wrap:wrap;gap:4px 10px;font:11px var(--mono);color:var(--ink-3)}
.st{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);letter-spacing:.04em;color:var(--ink-2)}
.st i{width:9px;height:9px;flex:none}
.st.s0 i{background:var(--warn);border-radius:2px;transform:rotate(45deg)}
.st.s1 i{background:var(--good);border-radius:50%}
.st.s2 i{border:2px solid var(--serious);border-radius:50%}
.st.s3 i{background:var(--info);border-radius:2px}

/* Brain overlays */
#v-brain{padding:0;overflow:hidden;pointer-events:none}
#v-brain>*{pointer-events:auto}
.glass{background:rgba(10,10,10,.78);border:1px solid var(--line);border-radius:12px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#bTop{position:absolute;left:16px;top:14px;right:292px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;pointer-events:none}
#bTop>*{pointer-events:auto}
#bCount{font:12px var(--mono);color:var(--ink-2);padding:6px 10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;background:rgba(10,10,10,.78);color:var(--ink-2)}
.chip button{color:var(--ink-3);font-size:14px;line-height:1}
.chip button:hover{color:var(--ink)}
#bHint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:min(560px,calc(100% - 600px));text-align:center;font-size:12px;color:var(--ink-3);pointer-events:none}
#legend{position:absolute;left:16px;bottom:14px;width:236px;max-height:46%;overflow:auto;padding:10px 6px 8px}
#legend .cap{padding:0 8px 6px;display:flex;justify-content:space-between}
#legend button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:4px 8px;border-radius:6px;text-align:left;font-size:12.5px;color:var(--ink-2)}
#legend button:hover{background:var(--raised);color:var(--ink)}
#legend button.on{background:var(--raised);color:var(--ink)}
#legend button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#legend button .num{font-size:11px;color:var(--ink-3)}
#vp{position:absolute;right:var(--gr);top:14px;width:256px;max-height:calc(100% - 28px);overflow:auto;padding:14px}
#vp h4{margin:14px 0 8px}
#vp h4:first-child{margin-top:0}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:7px 0;font-size:12px;color:var(--ink-3);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:#000;font-weight:500}
#formNote{margin:8px 0 0;font-size:12px;color:var(--ink-3)}
select{width:100%;font:13px var(--text);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px;font-size:13px;color:var(--ink-2)}
.tg{position:relative;width:32px;height:18px;border-radius:9px;border:1px solid var(--line);background:var(--surface);flex:none}
.tg::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--ink-3);transition:transform .15s}
.tg[aria-pressed="true"]{background:var(--ink-2);border-color:var(--ink-2)}
.tg[aria-pressed="true"]::after{background:#000;transform:translateX(14px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:120px;height:18px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink);margin-top:-5px}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--ink-3);background:var(--raised)}
.btn.pri{background:var(--ink);color:#000;border-color:var(--ink);font-weight:500}
#vpBtn{display:none;position:absolute;right:var(--gr);top:12px}

/* Timeline */
#v-timeline{right:46%;border-right:0}
.tlbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tlbar .btn{padding:4px 10px;font:12px var(--mono)}
.tlbar .btn.on{background:var(--ink);color:#000;border-color:var(--ink)}
#chartWrap{position:relative;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:12px 10px 6px}
#chart{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
#chart text{font:10px var(--mono);fill:var(--ink-3)}
#chartLegend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 4px 2px;font-size:12px;color:var(--ink-2)}
#chartLegend span{display:inline-flex;align-items:center;gap:6px}
#chartLegend i{width:10px;height:10px;border-radius:2px}
#tlRead{margin:12px 0 4px;font-size:13px;color:var(--ink-2)}
#tlRead b{color:var(--ink);font-weight:500}
table.tb{border-collapse:collapse;font:12px var(--mono);font-variant-numeric:tabular-nums;width:100%}
table.tb th,table.tb td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--line-soft);color:var(--ink-2);white-space:nowrap}
table.tb th:first-child,table.tb td:first-child{text-align:left}
.scroll-x{overflow-x:auto}
.list{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.list .li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:9px 13px;border-top:1px solid var(--line-soft);text-align:left}
.list .li:first-child{border-top:0}
.list button.li:hover{background:var(--raised)}
.list .li small{color:var(--ink-3);font:11px var(--mono)}
.list .li .t{min-width:0;overflow-wrap:anywhere}
.sec{margin:22px 0 8px}

/* Projects, Inbox, Sources */
.prow{display:grid;grid-template-columns:minmax(0,1.6fr) 130px 70px 110px;gap:12px;align-items:center;width:100%;padding:9px 13px;border-top:1px solid var(--line-soft);text-align:left}
.prow:first-child{border-top:0}
.prow:hover{background:var(--raised)}
.prow small{color:var(--ink-3);font:11px var(--mono)}
.inrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:10px 13px;border-top:1px solid var(--line-soft)}
.inrow:first-child{border-top:0}
.inrow .acts{display:flex;gap:6px;flex-wrap:wrap}
.inrow .btn{padding:4px 10px;font-size:12px}
.src{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.src>div{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px}
.src h4{margin:0 0 2px;font:600 14px var(--display)}
.src p{margin:6px 0 10px;color:var(--ink-2);font-size:13px}

/* Drawer */
#drawer{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);padding:18px var(--gr) 28px 20px;overflow:auto;transform:translateX(102%);transition:transform .22s ease;z-index:20}
#drawer.open{transform:none}
#drawer .x{position:absolute;right:var(--gr);top:12px;width:30px;height:30px;border-radius:8px;font-size:18px;color:var(--ink-3)}
#drawer .x:hover{background:var(--raised);color:var(--ink)}
#drawer h2{font-size:20px;margin:6px 34px 6px 0}
#drawer .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font:11.5px var(--mono);color:var(--ink-3)}
#drawer p{color:var(--ink-2);max-width:60ch}
#drawer h5{margin:18px 0 6px}
#drawer .acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.ref{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:8px;color:var(--ink-2)}
.ref:hover{background:var(--raised);color:var(--ink)}
.ref small{display:block;font:11px var(--mono);color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font:11px var(--mono);color:var(--ink-2)}

#tip{position:fixed;left:0;top:0;z-index:40;pointer-events:none;max-width:280px;padding:7px 10px;border-radius:8px;background:rgba(6,6,7,.94);border:1px solid var(--line);font-size:12.5px;will-change:transform}
#tip small{display:block;font:11px var(--mono);color:var(--ink-3);margin-top:2px}
#tip .tr{display:flex;justify-content:space-between;gap:14px;font:11.5px var(--mono);color:var(--ink-2)}
#tip .tr i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
#pal{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:flex-start;padding:12vh var(--gr) 0 var(--gl)}
#pal>div{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#palIn{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:15px var(--text);padding:14px 16px;outline:none}
#palOut{max-height:52vh;overflow:auto}
#palOut .ref{border-radius:0;padding:9px 16px}
#palOut .ref.sel{background:var(--raised)}
#toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;padding:9px 14px;border-radius:8px;background:var(--ink);color:#000;font-size:13px;max-width:calc(100% - 32px)}

@media (max-width:1100px){ .board{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  #nav{order:2;flex-direction:row;gap:0;padding:6px var(--gr) 6px var(--gl);border-right:0;border-top:1px solid var(--line-soft);overflow-x:auto}
  #brand,#searchBtn kbd,#demoNote,#nav .sp{display:none}
  #searchBtn{margin:0;border:0;padding:8px 10px}
  #nav button.nv{flex:1 0 auto;justify-content:center;gap:5px;padding:8px 9px;font-size:12.5px}
  .view{padding:18px var(--gr) 30px var(--gl)}
  .board{grid-template-columns:minmax(0,1fr)}
  .live .row{grid-template-columns:minmax(0,1fr)}
  body.at-timeline #stage{display:none}
  #v-timeline{right:0}
  #bTop{left:var(--gl);right:84px}
  #vp{display:none;left:var(--gl);right:var(--gr);top:52px;width:auto;max-height:62%}
  #vp.open{display:block}
  #vpBtn{display:inline-flex}
  #legend{left:var(--gl);right:var(--gr);width:auto;max-height:118px;bottom:10px}
  #bHint{display:none}
  .prow{grid-template-columns:minmax(0,1fr) auto}
  .prow .hide-s{display:none}
  #drawer{top:auto;height:78%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(102%);padding-left:var(--gl)}
}
@media (prefers-reduced-motion:reduce){ #drawer,.tg::after{transition:none} }
</style>

</head>
<body>
<div id="app">
  <nav id="nav" aria-label="Sections">
    <div id="brand">Second Brain OS<small>demo data · mockup</small></div>
    <button id="searchBtn" aria-label="Search"><span>Search</span><kbd>⌘K</kbd></button>
    <button class="nv" data-view="now"><span>Now</span><span class="badge" id="bdNow"></span></button>
    <button class="nv" data-view="brain"><span>Brain</span></button>
    <button class="nv" data-view="timeline"><span>Timeline</span></button>
    <button class="nv" data-view="projects"><span>Projects</span><span class="badge" id="bdProj"></span></button>
    <button class="nv" data-view="inbox"><span>Inbox</span><span class="badge" id="bdInbox"></span></button>
    <button class="nv" data-view="sources"><span>Sources</span></button>
    <div class="sp"></div>
    <div id="demoNote">Everything here is generated example data. Nothing is imported or saved.</div>
  </nav>

  <main id="main">
    <div id="stage"><canvas id="gl"></canvas><div id="labels"></div><div id="ring" hidden></div></div>

    <section class="view" id="v-now"></section>

    <section class="view" id="v-brain">
      <div id="bTop"><span id="bCount" class="glass"></span><span id="bChips"></span></div>
      <button id="vpBtn" class="btn glass">View</button>
      <div id="vp" class="glass">
        <h4 class="cap">Form</h4>
        <div class="seg" id="formSeg">
          <button data-form="anatomy">Anatomy</button><button data-form="spheres">Spheres</button><button data-form="rings">Rings</button><button data-form="ribbon">Ribbon</button>
        </div>
        <p id="formNote"></p>
        <h4 class="cap">Group and colour by</h4>
        <select id="groupBy" aria-label="Group and colour by">
          <option value="area">Area of life</option><option value="project">Project</option><option value="source">Source</option>
          <option value="type">What it is</option><option value="status">Project status</option><option value="year">Year</option>
        </select>
        <h4 class="cap">Show</h4>
        <div class="row"><span>Labels</span><button class="tg" id="tLabels" aria-pressed="true" aria-label="Labels"></button></div>
        <div class="row"><span>Links of the hovered item</span><button class="tg" id="tLinks" aria-pressed="true" aria-label="Links"></button></div>
        <div class="row"><span>Spine and nerves</span><button class="tg" id="tScaf" aria-pressed="true" aria-label="Spine and nerves"></button></div>
        <div class="row"><span>Turning</span><button class="tg" id="tTurn" aria-pressed="true" aria-label="Turning"></button></div>
        <h4 class="cap">Drawn</h4>
        <div class="row"><label for="sSize">Point size</label><input type="range" id="sSize" min="0.5" max="2.2" step="0.01" value="1"></div>
        <div class="row"><label for="sGlow">Glow</label><input type="range" id="sGlow" min="0" max="2" step="0.01" value="0.35"></div>
        <div class="row" style="margin-top:8px"><button class="btn" id="bReset">Reset view</button><button class="btn" id="bClear">Clear filters</button></div>
      </div>
      <div id="legend" class="glass"></div>
      <div id="bHint"></div>
    </section>

    <section class="view" id="v-timeline"></section>
    <section class="view" id="v-projects"></section>
    <section class="view" id="v-inbox"></section>
    <section class="view" id="v-sources"></section>

    <aside id="drawer" aria-label="Details"></aside>
    <div id="pal" hidden><div><input id="palIn" placeholder="Search projects and items…" autocomplete="off" spellcheck="false" aria-label="Search"><div id="palOut"></div></div></div>
    <div id="toast" hidden></div>
  </main>
</div>
<div id="tip" hidden></div>

<script>
"use strict";
/* Second Brain OS — clickable mockup. One record of items (chats, notes, files), several views over it.
   Sections: 1 demo data · 2 layouts · 3 renderer · 4 camera, picking, filters · 5 pages · 6 drawer, search, routing */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, TAU = Math.PI*2, fmt = n => n.toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
