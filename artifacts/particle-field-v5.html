<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>2ndbrain · particle field v5</title>
<style>
:root{
  --ink:#d9fff4; --dim:rgba(190,255,236,.55); --faint:rgba(170,255,230,.28);
  --line:rgba(120,255,220,.13); --glass:rgba(3,10,10,.62); --acc:#3dffc8; --acc2:#39d6ff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:var(--sans);overflow:hidden;overscroll-behavior:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:#000}
canvas#gl.drag{cursor:grabbing} canvas#gl.hot{cursor:pointer}
.panel{position:fixed;background:var(--glass);border:1px solid var(--line);border-radius:14px;
  -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
  box-shadow:0 10px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(180,255,240,.05)}
.cap{font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
body.noui .panel, body.noui #hint, body.noui #labels, body.noui #tuneBtn{opacity:0;pointer-events:none}
.panel,#hint,#labels{transition:opacity .35s}

/* HUD */
#hud{top:14px;left:14px;padding:12px 14px 12px;width:268px}
#brand{display:flex;align-items:baseline;gap:8px;font:600 13px/1 var(--sans);letter-spacing:.02em}
#brand i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px 2px var(--acc);display:inline-block;transform:translateY(-1px)}
#brand span{color:var(--faint);font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase}
#stats{margin-top:9px;font:11px/1.55 var(--mono);color:var(--dim);white-space:nowrap}
#stats b{color:var(--ink);font-weight:600}
#search{margin-top:10px;width:100%;background:rgba(120,255,220,.05);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);font:12px var(--sans);padding:7px 9px;outline:none}
#search:focus{border-color:rgba(61,255,200,.5)} #search::placeholder{color:var(--faint)}
#results{margin-top:6px;display:none;max-height:190px;overflow:auto}
#results div{padding:5px 8px;border-radius:6px;font-size:12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#results div:hover{background:rgba(120,255,220,.09)} #results small{color:var(--faint);font:10px var(--mono)}

/* Controls */
#ctl{top:14px;right:14px;width:262px;max-height:calc(100% - 28px);overflow:auto;padding:12px 14px 14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#ctl h4{margin:14px 0 8px;display:flex;justify-content:space-between;align-items:center}
#ctl h4:first-child{margin-top:0}
.row{display:grid;grid-template-columns:86px 1fr 44px;align-items:center;gap:8px;height:24px;font-size:11.5px;color:var(--dim)}
.row output{font:10.5px var(--mono);color:var(--ink);text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,rgba(61,255,200,.55),rgba(57,214,255,.18));border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:linear-gradient(90deg,rgba(61,255,200,.55),rgba(57,214,255,.18));border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#eafff9;margin-top:-4.5px;box-shadow:0 0 0 3px rgba(61,255,200,.18),0 0 12px rgba(61,255,200,.9)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:#eafff9;box-shadow:0 0 0 3px rgba(61,255,200,.18),0 0 12px rgba(61,255,200,.9)}
#temp::-webkit-slider-runnable-track{background:linear-gradient(90deg,#9dff3c,#19ff7a,#12f0c0,#35c8ff,#5a8cff)}
#temp::-moz-range-track{background:linear-gradient(90deg,#9dff3c,#19ff7a,#12f0c0,#35c8ff,#5a8cff)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
button{font:500 11px var(--sans);color:var(--ink);background:rgba(120,255,220,.06);border:1px solid var(--line);border-radius:8px;padding:7px 8px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:rgba(120,255,220,.13);border-color:rgba(61,255,200,.4)}
button.on{background:rgba(61,255,200,.16);border-color:rgba(61,255,200,.55)}
#keys{margin-top:12px;font:10px/1.7 var(--mono);color:var(--faint)}
#keys kbd{color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 4px;font:inherit}
#tuneBtn{display:none;position:fixed;top:14px;right:14px;z-index:5}

/* Inspector */
#insp{left:14px;bottom:14px;width:300px;max-height:min(62%,560px);overflow:auto;padding:14px;display:none;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#insp.show{display:block;animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#insp .x{position:absolute;top:8px;right:8px;padding:2px 8px;border-radius:6px;font-size:14px;line-height:1.2}
#insp h2{margin:6px 0 2px;font:600 19px/1.2 var(--sans);letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
#insp h2 i{flex:none;width:10px;height:10px;border-radius:50%}
#insp .dom{font:11px var(--mono);color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.grid div{background:rgba(120,255,220,.045);border:1px solid var(--line);border-radius:9px;padding:7px 8px}
.grid b{display:block;font:600 14px var(--mono);color:var(--ink)} .grid span{font:9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
#insp h5{margin:14px 0 6px}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:5px 7px;border-radius:7px;font-size:12px;cursor:pointer;color:var(--dim)}
.li:hover{background:rgba(120,255,220,.09);color:var(--ink)} .li small{font:10px var(--mono);color:var(--faint);white-space:nowrap}
.li.cur{background:rgba(61,255,200,.12);color:var(--ink)}
.unit{border:1px solid rgba(61,255,200,.3);background:rgba(61,255,200,.06);border-radius:10px;padding:9px 10px;margin-top:12px}
.unit b{display:block;font-size:13px;margin:3px 0 2px}
.note{margin-top:12px;font:10px/1.5 var(--mono);color:var(--faint)}

/* overlays */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:rgba(200,255,240,.5);
  text-shadow:0 0 8px #000,0 0 3px #000;will-change:transform;transform:translate(-999px,-999px)}
.lb.hi{color:#eafff9;font-size:11.5px}
.lb::before{content:"";display:inline-block;width:14px;height:1px;background:currentColor;opacity:.6;vertical-align:middle;margin-right:6px}
#ring{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border:1px solid #eafff9;border-radius:50%;pointer-events:none;display:none;
  box-shadow:0 0 12px rgba(61,255,200,.9), inset 0 0 6px rgba(61,255,200,.6);will-change:transform}
#tip{position:fixed;left:0;top:0;pointer-events:none;display:none;padding:6px 9px;border-radius:8px;background:rgba(2,8,8,.85);border:1px solid var(--line);
  font-size:11.5px;max-width:260px;will-change:transform;z-index:6}
#tip small{display:block;font:10px var(--mono);color:var(--dim);margin-top:2px}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font:10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  pointer-events:none;white-space:nowrap}
#hint.gone{opacity:0}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--dim);font:14px/1.6 var(--sans)}

@media (max-width:760px){
  #hud{width:auto;right:auto;max-width:calc(100% - 96px);padding:10px 12px}
  #search,#results{display:none!important}
  #stats{font-size:10px}
  #tuneBtn{display:block}
  #ctl{top:auto;right:8px;left:8px;bottom:8px;width:auto;max-height:56%;display:none}
  #ctl.open{display:block}
  #insp{left:8px;right:8px;bottom:8px;width:auto;max-height:46%}
  #hint{display:none} #keys{display:none}
}

#legend{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:2px 6px}
#legend button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:7px;font:11px var(--sans);color:var(--dim);cursor:pointer;padding:3px 5px;border-radius:6px;white-space:nowrap}
#legend button:hover,#legend button.on{background:rgba(120,255,220,.1);color:var(--ink)}
#legend button:focus-visible{outline:1px solid var(--acc)}
#legend i{flex:none;width:8px;height:8px;border-radius:50%}
#legendNote{margin-top:6px;font:10px/1.45 var(--mono);color:var(--faint);white-space:normal}
.row.off{opacity:.3}
@media (max-width:760px){
  #legend{grid-template-columns:repeat(6,auto);justify-content:start;gap:2px;margin-top:6px}
  #legend span{display:none} #legend button{padding:6px} #legend i{width:11px;height:11px}
  #legendNote{font-size:9.5px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="ring"></div>
<div id="tip"></div>

<div id="hud" class="panel">
  <div id="brand"><i></i>2ndbrain <span>particle field · v5</span></div>
  <div id="stats">initialising…</div>
  <input id="search" placeholder="Search clusters…  ( / )" autocomplete="off" spellcheck="false">
  <div id="results"></div>
</div>

<button id="tuneBtn">Tune</button>
<div id="ctl" class="panel"></div>

<div id="insp" class="panel"></div>
<div id="hint">drag · orbit &nbsp;—&nbsp; scroll · zoom &nbsp;—&nbsp; right-drag · pan &nbsp;—&nbsp; click · inspect</div>
<div id="err"></div>

<script>
"use strict";
/* ============================================================================
   2ndbrain · particle field v5  — nervous-system layout, mapped and coloured by domain
   Single file, zero dependencies, raw WebGL2.

   v2 simulated ~80k particles on the CPU. v3 trades per-particle physics for
   density: every particle's motion is a closed-form function of time evaluated
   in the vertex shader, so several hundred thousand units animate for free.
   The CPU only runs the 72-node force-directed cluster graph and mirrors the
   shader maths for the handful of particles it needs to pick or annotate.

     1. Graph      – domains -> clusters -> links, live force-directed layout
     2. Particles  – one-off generation of sculpted clouds, strands and dust
     3. Renderer   – HDR additive dust -> gentle bloom -> hue-preserving tonemap
     4. Camera / picking / UI
   ========================================================================== */
const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const fmt = n => n.toLocaleString("en-US");
const TAU = Math.PI*2;
function hash(n){ n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return n >>> 0; }
function rngFactory(seed){ let s = seed>>>0; return function(){ s = (s + 0x6D2B79F5)>>>0; let t = s; t = Math.imul(t ^ (t>>>15), t|1); t ^= t + Math.imul(t ^ (t>>>7), t|61); return ((t ^ (t>>>14))>>>0) / 4294967296; }; }

const coarse = matchMedia("(pointer:coarse)").matches;
const small = Math.min(screen.width, screen.height) < 760 || coarse;
const cores = navigator.hardwareConcurrency || 4;
const N_MAX = small ? 400000 : 1000000;

const S = {
  n: qs.has("n") ? clamp(+qs.get("n")|0, 10000, N_MAX) : (small ? 120000 : cores <= 4 ? 250000 : 400000),
  form: qs.has("form") ? clamp(+qs.get("form"), 0, 1) : 0.3,
  anat: qs.has("anat") ? clamp(+qs.get("anat"), 0, 1) : 1,
  glow: 0.7, exposure: 1.0, size: 1.0, temp: 0, range: qs.has("range") ? clamp(+qs.get("range"), 0, 1) : 0.9, signal: 1.0,
  tight: 1.0, spread: 1.0, link: 1.0, swirl: 1.0, turb: 1.0, flow: 1.0, speed: 1.0,
  rotate: !matchMedia("(prefers-reduced-motion: reduce)").matches, labels: false
};
let seed = qs.has("seed") ? (+qs.get("seed")|0) : 7;

/* ------------------------------------------------------------- 1. GRAPH --- */
const C = 72, D = 6;
/* Layout rule: importance decides how central a cluster is, domain decides which body band it lives in.
   Per domain: its 2 largest clusters are brain lobes (one per hemisphere), its 2 most cross-linked clusters
   are spinal ganglia at the band's cord level, and the remaining 8 spread over that band's nerves, 4 a side. */
const BAND_OF = [0, 5, 4, 1, 3, 2];   // domain index -> body band
const BANDS = ["shoulders & upper arms", "forearms & hands", "chest", "abdomen", "hips & thighs", "lower legs & feet"];
let G = null;   // graph + particle data for the current seed
function buildGraph(){
  const rnd = rngFactory(seed*2654435761 + 12345);
  const gauss = () => { let u = 0; while(u < 1e-7) u = rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*rnd()); };
  const g = { rnd, gauss, C, D };
  g.lx = new Float32Array(C); g.ly = new Float32Array(C); g.lz = new Float32Array(C);
  g.vx = new Float32Array(C); g.vy = new Float32Array(C); g.vz = new Float32Array(C);
  g.a = new Float32Array(C); g.w = new Float32Array(C); g.hue = new Float32Array(C); g.domain = new Uint8Array(C); g.rank = new Uint8Array(C);
  g.axis = new Float32Array((C+1)*4); g.shape = new Uint8Array(C); g.ph = new Float32Array(C);
  const dc = new Float32Array(D*3), dHue = new Float32Array(D), order = [0,3,1,4,2,5], hoff = Math.floor(rnd()*D);
  for(let d=0;d<D;d++){ const th = TAU*(d+0.6*(rnd()-0.5))/D, r = 55+30*rnd(); dc[d*3] = Math.cos(th)*r; dc[d*3+1] = gauss()*16; dc[d*3+2] = Math.sin(th)*r; dHue[d] = (order[(d+hoff)%D]+0.5)/D; }
  let wsum = 0; for(let k=0;k<C;k++){ g.w[k] = Math.pow(1/(k+2), 0.78)*(0.75+0.5*rnd()); wsum += g.w[k]; }
  for(let k=0;k<C;k++){
    const d = k % D; g.domain[k] = d; g.rank[k] = (k/D)|0;
    g.lx[k] = dc[d*3]+gauss()*30; g.ly[k] = dc[d*3+1]+gauss()*18; g.lz[k] = dc[d*3+2]+gauss()*30;
    g.a[k] = Math.max(5.6, 7.6*Math.pow(g.w[k]/(wsum/C), 0.36));
    g.hue[k] = (BAND_OF[d]+0.5)/6+(rnd()-0.5)*0.05;
    const z = rnd()*2-1, t = rnd()*TAU, s = Math.sqrt(1-z*z);
    g.axis[k*4] = s*Math.cos(t); g.axis[k*4+1] = s*Math.sin(t); g.axis[k*4+2] = z; g.axis[k*4+3] = (0.035+0.05*rnd())*(rnd()<0.5?-1:1);
    const q = rnd(); g.shape[k] = q < 0.5 ? 0 : q < 0.82 ? 1 : 2;   // cloud | disk | ring
    g.ph[k] = rnd(); g.w[k] /= wsum;
  }
  g.axis[C*4+1] = 1; g.axis[C*4+3] = 0.012;                          // far halo: slow turn about y
  // edges: per-domain MST + local extras + domain bridges
  const EA = [], EB = [], seen = new Set();
  const addE = (a,b) => { if(a === b) return; const k = a<b?a*C+b:b*C+a; if(seen.has(k)) return; seen.add(k); EA.push(a); EB.push(b); };
  const d2 = (a,b) => (g.lx[a]-g.lx[b])**2+(g.ly[a]-g.ly[b])**2+(g.lz[a]-g.lz[b])**2;
  for(let d=0;d<D;d++){
    const mem = []; for(let k=0;k<C;k++) if(g.domain[k] === d) mem.push(k);
    const inT = [mem[0]], out = mem.slice(1);
    while(out.length){ let bi=0,bj=0,bd=1e30; for(let i=0;i<inT.length;i++) for(let j=0;j<out.length;j++){ const q = d2(inT[i],out[j]); if(q<bd){bd=q;bi=i;bj=j;} } addE(inT[bi],out[bj]); inT.push(out[bj]); out.splice(bj,1); }
    for(const a of mem) if(rnd() < 0.42){ let b=-1,bd=1e30; for(const m of mem){ if(m===a) continue; const k = a<m?a*C+m:m*C+a; if(seen.has(k)) continue; const q = d2(a,m); if(q<bd){bd=q;b=m;} } if(b>=0) addE(a,b); }
  }
  const bridge = (p,q) => { let ba=-1,bb=-1,bd=1e30; for(let a=0;a<C;a++){ if(g.domain[a]!==p) continue; for(let b=0;b<C;b++){ if(g.domain[b]!==q) continue; const s = d2(a,b); if(s<bd){bd=s;ba=a;bb=b;} } } if(ba>=0) addE(ba,bb); };
  for(let d=0;d<D;d++) bridge(d,(d+1)%D);
  for(let k=0;k<4;k++){ const p = (rnd()*D)|0, q = (p+2+((rnd()*(D-3))|0))%D; bridge(p,q); }
  for(let k=0;k<5;k++){ const a = (rnd()*C)|0; let b=-1,bd=1e30; for(let m=0;m<C;m++){ if(g.domain[m]===g.domain[a]) continue; const s = d2(a,m); if(s<bd){bd=s;b=m;} } if(b>=0) addE(a,b); }
  g.E = EA.length; g.eA = Int16Array.from(EA); g.eB = Int16Array.from(EB);
  g.eRef = new Float32Array(g.E*3); g.eBow = new Float32Array(g.E); g.eTwist = new Float32Array(g.E); g.eStr = new Uint8Array(g.E); g.ePh = new Float32Array(g.E);
  for(let e=0;e<g.E;e++){ const z = rnd()*2-1, t = rnd()*TAU, s = Math.sqrt(1-z*z); g.eRef[e*3] = s*Math.cos(t); g.eRef[e*3+1] = s*Math.sin(t); g.eRef[e*3+2] = z;
    g.eBow[e] = (0.05+0.13*rnd())*(rnd()<0.5?-1:1); g.eTwist[e] = (0.8+1.8*rnd())*(rnd()<0.5?-1:1)*TAU; g.eStr[e] = 2+((rnd()*2)|0); g.ePh[e] = rnd(); }
  g.neigh = []; g.edgeOf = []; g.names = [];
  for(let c=0;c<C;c++){ g.neigh.push([]); g.edgeOf.push([]); g.names.push(DOMAINS[g.domain[c]][1][g.rank[c] % 12]); }
  for(let e=0;e<g.E;e++){ const a = g.eA[e], b = g.eB[e]; g.neigh[a].push(b); g.neigh[b].push(a); g.edgeOf[a].push(e); g.edgeOf[b].push(e); }
  g.fx = new Float32Array(C*3); g.time = 0;
  for(let it=0;it<700;it++) layoutStep(g, 0.05, 1, 1, false);
  // sampling tables
  g.cCum = new Float32Array(C); let acc = 0; for(let c=0;c<C;c++){ acc += g.w[c]; g.cCum[c] = acc; }
  g.eCum = new Float32Array(g.E); acc = 0; for(let e=0;e<g.E;e++){ acc += Math.sqrt(g.w[g.eA[e]]*g.w[g.eB[e]])*Math.sqrt(Math.sqrt(d2(g.eA[e],g.eB[e]))+10); g.eCum[e] = acc; }
  for(let e=0;e<g.E;e++) g.eCum[e] /= acc;
  buildAnatomy(g);
  // particle store (grown lazily)
  g.made = 0; g.pA = new Float32Array(0); g.pB = new Float32Array(0); g.pN = new Float32Array(0);
  return g;
}
/* Nervous-system layout. A nerve tree is grown for the midline and the right side, then mirrored, so the
   figure is bilaterally symmetric. Every cluster sits on a tree node; every link is a fibre routed along the
   tree between its two clusters. V[i] = [x, y, z, parent, band]. */
const PK = 128;                                              // samples per fibre route
const LOBE = [[6.5,110,13.5],[7,116,4],[7,115,-7],[6,108.5,-14.5],[11.5,103.5,6],[12,105.5,-5]];   // right-hemisphere lobe centres, one per band
function buildAnatomy(g){
  const rnd = g.rnd, gauss = g.gauss, V = []; let band = -1;
  const add = (x,y,z,p) => { V.push([x,y,z,p,band]); return V.length-1; };
  const chain = (p, pts, wob) => { let last = p; wob = wob === undefined ? 0.7 : wob;
    for(const q of pts){ const a = V[last], d = Math.hypot(q[0]-a[0], q[1]-a[1], q[2]-a[2]), n = Math.max(1, Math.round(d/3.5));
      for(let i=1;i<=n;i++){ const f = i/n, j = i<n ? wob : 0; last = add(a[0]+(q[0]-a[0])*f+(rnd()-0.5)*j, a[1]+(q[1]-a[1])*f+(rnd()-0.5)*j, a[2]+(q[2]-a[2])*f+(rnd()-0.5)*j, last); } }
    return last; };
  // ---- midline: brainstem and spinal cord
  const root = add(0, 84, -2, -1), stem = chain(root, [[0,89,-2.6],[0,95.5,-1.5]], 0.3);

  const h2 = el("h2"), dot = el("i"); dot.style.background = swatch(c); dot.style.boxShadow = "0 0 12px "+swatch(c); h2.append(dot, G.names[c]); root.append(h2);
  root.append(el("div", "dom", DOMAINS[G.domain[c]][0]+" · "+(S.anat > 0.5 ? regionOf(c) : SHAPES[G.shape[c]])));
  const grid = el("div", "grid"), bridges = G.edgeOf[c].reduce((s, e) => s+count(C+e), 0);
  [[fmt(count(c)), "units"], [G.neigh[c].length, "links"], [fmt(bridges), "bridge notes"]].forEach(([v, k]) => { const d = el("div"); d.append(el("b", "", v), el("span", "", k)); grid.append(d); }); root.append(grid);
  if(selUnit >= 0){ const u = el("div", "unit"); u.append(el("div", "cap", "Selected unit · #"+selUnit), el("b", "", titleOf(selUnit)));
    const ls = linksOf(selUnit); u.append(el("div", "cap", ls.length+" links")); u.lastChild.style.margin = "8px 0 4px";
    for(const j of ls){ const r = el("div", "li"); r.append(el("span", "", titleOf(j)), el("small", "", "#"+j)); r.onclick = () => select(clusterOfUnit(j), j); u.append(r); } root.append(u); }
  root.append(el("h5", "cap", "Connected clusters"));
  for(const n of G.neigh[c].slice().sort((a, b) => count(b)-count(a))){ const r = el("div", "li"); r.append(el("span", "", G.names[n]), el("small", "", fmt(count(n)))); r.onclick = () => select(n);
    r.onmouseenter = () => { hoverGroup = n; updateState(); }; r.onmouseleave = () => { hoverGroup = -1; updateState(); }; root.append(r); }
  root.append(el("h5", "cap", "Units in this cluster"));
  for(let k=0;k<6;k++){ const j = unitIn(c, hash(c*977+k*131+seed)); if(j < 0) break; const r = el("div", "li"+(j === selUnit ? " cur" : "")); r.append(el("span", "", titleOf(j)), el("small", "", "#"+j)); r.onclick = () => select(c, j); root.append(r); }

let labelIds = [], labelEls = [];
function buildLabels(){ const root = $("#labels"); root.innerHTML = ""; labelIds = []; labelEls = []; const set = new Set();
  if(sel >= 0){ set.add(sel); G.neigh[sel].forEach(n => set.add(n)); } else if(S.labels) [...Array(C).keys()].sort((a, b) => G.w[b]-G.w[a]).slice(0, small ? 6 : 12).forEach(c => set.add(c));
  for(const c of set){ const d = el("div", "lb"+(c === sel ? " hi" : ""), G.names[c]); root.append(d); labelIds.push(c); labelEls.push(d); } }
function placeOverlays(){
  const k = cssH/(2*Math.tan(FOV/2));
  for(let i=0;i<labelIds.length;i++){ const c = labelIds[i]; project(anch[c*4], anch[c*4+1], anch[c*4+2], tmpP);
    if(tmpP[2] < 0){ labelEls[i].style.transform = "translate(-999px,-999px)"; continue; } const r = (G.a[c]*1.1*(1-anatW(0.5))+G.nr[c]*1.2*anatW(0.5))*k/tmpP[2];
    labelEls[i].style.transform = `translate(${(tmpP[0]+r*0.75+6).toFixed(1)}px,${(tmpP[1]-r*0.75-10).toFixed(1)}px)`; labelEls[i].style.opacity = clamp(1.6-tmpP[2]/420, 0.3, 1); }
  const ring = $("#ring"); lineCount = 0;
  if(selUnit >= 0){ unitPos(selUnit, tmpQ); const sx = tmpQ[0], sy = tmpQ[1], sz = tmpQ[2]; project(sx, sy, sz, tmpP);
    if(tmpP[2] > 0){ ring.style.display = "block"; ring.style.transform = `translate(${tmpP[0].toFixed(1)}px,${tmpP[1].toFixed(1)}px)`; } else ring.style.display = "none";
    for(const j of linksOf(selUnit)){ if(lineCount >= MAXL) break; unitPos(j, tmpQ); const q = lineCount*8;
      lineData[q] = sx; lineData[q+1] = sy; lineData[q+2] = sz; lineData[q+3] = 1; lineData[q+4] = tmpQ[0]; lineData[q+5] = tmpQ[1]; lineData[q+6] = tmpQ[2]; lineData[q+7] = 0.35; lineCount++; }
  } else ring.style.display = "none";

const search = $("#search"), results = $("#results");
search.addEventListener("input", () => { const q = search.value.trim().toLowerCase(); results.innerHTML = ""; if(!q){ results.style.display = "none"; return; }
  const hits = []; for(let c=0;c<C;c++) if(G.names[c].toLowerCase().includes(q) || DOMAINS[G.domain[c]][0].toLowerCase().includes(q)) hits.push(c);
  hits.sort((a, b) => count(b)-count(a)).slice(0, 8).forEach(c => { const d = el("div"); d.append(el("span", "", G.names[c]), el("small", "", fmt(count(c)))); d.onclick = () => { select(c); results.style.display = "none"; search.value = ""; search.blur(); }; results.append(d); });
  results.style.display = hits.length ? "block" : "none"; });
search.addEventListener("keydown", e => { if(e.key === "Enter" && results.firstChild) results.firstChild.click(); });

/* ------------------------------------------------------------ lifecycle --- */
let genMs = 0;
function applyCount(){
  const t0 = performance.now(); growParticles(G, S.n); indexGroups(G, S.n); buildPickSamples();
  if(!G.uploaded){ gl.bindBuffer(gl.ARRAY_BUFFER, bufA); gl.bufferData(gl.ARRAY_BUFFER, G.pA, gl.STATIC_DRAW); gl.bindBuffer(gl.ARRAY_BUFFER, bufB); gl.bufferData(gl.ARRAY_BUFFER, G.pB, gl.STATIC_DRAW); gl.bindBuffer(gl.ARRAY_BUFFER, bufN); gl.bufferData(gl.ARRAY_BUFFER, G.pN, gl.STATIC_DRAW); G.uploaded = true; }
  genMs = performance.now()-t0; if(selUnit >= S.n) selUnit = -1; renderInspector();
}
function newField(){
  G = buildGraph(); anchW = Math.max(C+1, G.E); anch = new Float32Array(anchW*5*4); updateAnchors(G);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, pathTex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, PK, G.E, 0, gl.RGBA, gl.FLOAT, G.pathTex); gl.activeTexture(gl.TEXTURE0);

}
let tPrev = performance.now(), clock = 0, fps = 60, statT = 0, slowT = 0, warm = 0;
function frame(tNow){
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (tNow-tPrev)/1000); tPrev = tNow; clock += dt; warm += dt; fps += ((1/Math.max(dt, 1e-3))-fps)*0.06;

  updateAnchors(G);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, anchTex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, anchW, 5, 0, gl.RGBA, gl.FLOAT, anch); gl.activeTexture(gl.TEXTURE0);
  updateCamera(dt); if(needHover) hover(); placeOverlays();

  gl.bindFramebuffer(gl.FRAMEBUFFER, scene.fbo); gl.viewport(0, 0, scene.w, scene.h); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.useProgram(progPoints.p); const U = progPoints.u;
  gl.uniformMatrix4fv(U.uVP, false, VP); gl.uniform1f(U.uPx, scene.h/(2*Math.tan(FOV/2))); gl.uniform1f(U.uSize, 1.25*S.size*pxRatio); gl.uniform1f(U.uK, 6.0*pxRatio);
  gl.uniform1f(U.uTime, simTime); gl.uniform1f(U.uTemp, S.temp*0.5); gl.uniform1f(U.uTight, S.tight); gl.uniform1f(U.uSwirl, S.swirl); gl.uniform1f(U.uTurb, S.turb); gl.uniform1f(U.uFlow, S.flow); gl.uniform1f(U.uAnat, S.anat); gl.uniform1f(U.uRange, S.range); gl.uniform1f(U.uWave, S.signal); gl.uniform1f(U.uDist, cam.dist); gl.uniform1i(U.uC, C);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, pathTex); gl.uniform1i(U.uPath, 2); gl.activeTexture(gl.TEXTURE0);
  // keep overall luminance stable across density, resolution and how tightly the mass is packed
  gl.uniform1f(U.uGain, (HDR ? 0.20 : 0.10)*Math.pow(300000/S.n, 0.78)*Math.pow(formScale()*(1-anatW(0.5))+0.85*anatW(0.5), 1.1)/Math.pow(Math.max(pxRatio, 0.5), 1.2)/Math.pow(S.size, 1.2));
  gl.bindTexture(gl.TEXTURE_2D, stateTex); gl.uniform1i(U.uState, 0); gl.uniform1i(U.uAnch, 1);
  gl.bindVertexArray(vaoPoints); gl.drawArrays(gl.POINTS, 0, S.n);
  if(lineCount){ gl.useProgram(progLines.p); gl.uniformMatrix4fv(progLines.u.uVP, false, VP); gl.uniform3f(progLines.u.uCol, 0.07, 0.19, 0.17);
    gl.bindVertexArray(vaoLines); gl.bindBuffer(gl.ARRAY_BUFFER, bufLines); gl.bufferSubData(gl.ARRAY_BUFFER, 0, lineData.subarray(0, lineCount*8)); gl.drawArrays(gl.LINES, 0, lineCount*2); }

  gl.bindVertexArray(vaoFS); gl.disable(gl.BLEND); gl.useProgram(progDown.p); gl.uniform1i(progDown.u.uTex, 0); let src = scene;
  for(const m of mips){ gl.bindFramebuffer(gl.FRAMEBUFFER, m.fbo); gl.viewport(0, 0, m.w, m.h); gl.bindTexture(gl.TEXTURE_2D, src.tex); gl.uniform2f(progDown.u.uTexel, 1/src.w, 1/src.h); gl.drawArrays(gl.TRIANGLES, 0, 3); src = m; }
  gl.enable(gl.BLEND); gl.useProgram(progUp.p); gl.uniform1i(progUp.u.uTex, 0);
  for(let i=mips.length-1;i>0;i--){ const d = mips[i-1], s = mips[i]; gl.bindFramebuffer(gl.FRAMEBUFFER, d.fbo); gl.viewport(0, 0, d.w, d.h); gl.bindTexture(gl.TEXTURE_2D, s.tex);
    gl.uniform2f(progUp.u.uTexel, 1/s.w, 1/s.h); gl.uniform1f(progUp.u.uW, 0.7); gl.drawArrays(gl.TRIANGLES, 0, 3); }
  gl.disable(gl.BLEND); gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height); gl.useProgram(progComp.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.tex); gl.uniform1i(progComp.u.uScene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, mips[0].tex); gl.uniform1i(progComp.u.uBloom, 1);
  gl.uniform1f(progComp.u.uGlow, S.glow*0.8); gl.uniform1f(progComp.u.uExp, S.exposure*1.25); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.activeTexture(gl.TEXTURE0);

  if(!lockQuality && warm > 3){ if(fps < 27) slowT += dt; else slowT = Math.max(0, slowT-dt); if(slowT > 1.5 && quality > 0.5){ quality = Math.max(0.5, quality-0.17); slowT = 0; warm = 1.5; } }
  statT += dt;
  if(statT > 0.4){ statT = 0; $("#stats").innerHTML = `<b>${fmt(S.n)}</b> units · <b>${C}</b> clusters · <b>${G.E}</b> links<br><b>${fps.toFixed(0)}</b> fps · GPU-animated${quality < 1 ? " · res "+Math.round(quality*100)+"%" : ""}${HDR ? "" : " · LDR"}`; }
}
window.__field = { S, cam, BANDS, BAND_OF, regionOf, pickCluster, get G(){ return G; }, get stats(){ return {fps, quality, hdr:HDR, genMs, n:S.n}; }, select, resetView, unitPos, project, count,
  screenOf(c){ const o = [0,0,0]; project(anch[c*4], anch[c*4+1], anch[c*4+2], o); return o; }, get time(){ return simTime; }, set time(v){ simTime = v; } };

addEventListener("resize", resize); requestAnimationFrame(frame);
